<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>รายการ hero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5E51}
</style>
</helmet>
<div style="width: 390px; height: 340px; box-sizing: border-box; padding: 16px; background: #F3F5F7; font-family: 'Noto Sans Thai', system-ui, sans-serif; color: #1D2327">
<div style="position: relative; box-sizing: border-box; padding: 14px 14px 14px 14px; border-radius: 18px; border: 1px solid #BFE3DB; background: linear-gradient(180deg, #DDF2EE 0%, #FFFFFF 75%); display: flex; flex-direction: column; gap: 12px">
<button aria-label="พับการ์ด" style="position: absolute; top: 6px; right: 8px; width: 24px; height: 24px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; color: #5B6770">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
</button>
<div style="display: flex; align-items: center; gap: 8px; padding-right: 22px">
<div style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
</div>
<div style="flex: 1 1 auto; min-width: 0; height: 40px; box-sizing: border-box; border-radius: 20px; border: 1px solid #BFE3DB; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; padding: 0 6px">
<button aria-label="เดือนก่อน" style="width: 28px; height: 28px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; color: {{accent}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</button>
<button style="border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 4px; font-family: inherit; font-size: 15px; font-weight: 600; color: #1D2327">ตุลาคม 2026<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 9l6 7 6-7z"></path></svg></button>
<button aria-label="เดือนถัดไป" style="width: 28px; height: 28px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; color: {{accent}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</div>
<button aria-label="ค้นหา" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 1px solid #BFE3DB; background: #FFFFFF; padding: 0; display: flex; align-items: center; justify-content: center; color: {{accent}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
</button>
</div>
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-size: 16px; color: #3C474F">สุทธิ</span>
<span style="font-size: 28px; font-weight: 700; color: #D93A3F">−฿13,851.66</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="height: 36px; display: flex; align-items: flex-end; gap: 2px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="31">
<div style="flex: 1 1 0; height: {{b.h}}px; border-radius: 2px; background: {{b.c}}"></div>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #5B6770">
<span>1/10/2026</span><span>จ่ายเฉลี่ย ฿673.89/วัน</span><span>31/10/2026</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="border-radius: 12px; border: 1px solid #BDE5C9; background: linear-gradient(135deg, #E3F5E8 0%, #FFFFFF 100%); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #3C474F">รายรับ</span>
<span style="font-size: 17px; font-weight: 600; color: #1E9E4F">฿300</span>
</div>
<div style="border-radius: 12px; border: 1px solid #F2C2C3; background: linear-gradient(135deg, #FCE6E6 0%, #FFFFFF 100%); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #3C474F">รายจ่าย</span>
<span style="font-size: 17px; font-weight: 600; color: #D93A3F">฿14,151.66</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#12A08A","options":["#12A08A","#3B7DD8","#E07A2E"]},"$preview":{"width":390,"height":340}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#12A08A';
    const spend = { 9: 30, 10: 22, 21: 6 };
    const bars = [];
    for (let d = 1; d <= 31; d++) {
      if (d > 21) bars.push({ h: 3, c: '#E6EAED' });
      else if (d === 21) bars.push({ h: spend[d], c: '#D93A3F' });
      else if (spend[d]) bars.push({ h: spend[d], c: '#F4B9BA' });
      else bars.push({ h: 3, c: '#BFE3DB' });
    }
    return { accent, bars };
  }
}
</script>
</body>
</html>
