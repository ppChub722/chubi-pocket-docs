<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>การตั้งค่ากดได้ทันที</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5E51}
</style>
</helmet>
<div style="width: 390px; height: 300px; box-sizing: border-box; padding: 16px; background: #F3F5F7; font-family: 'Noto Sans Thai', system-ui, sans-serif; color: #1D2327; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
<span style="font-size: 15px; font-weight: 600; color: #0E7C6B">การตั้งค่า</span>
<span style="font-size: 12px; color: #5B6770">กระเป๋านี้นับในยอดและรายงานอย่างไร</span>
</div>
<div style="border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #EEF1F3">
<label for="track" style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 500">ติดตามยอดเงิน</span>
<span style="font-size: 12px; color: #5B6770">ปิดไว้ถ้าไม่ต้องการดูยอดคงเหลือของกระเป๋านี้ (ยังบันทึกรายการและโอนได้)</span>
</label>
<button id="track" role="switch" aria-checked="{{on}}" aria-label="ติดตามยอดเงิน" onClick="{{toggle}}" style="width: 48px; height: 28px; flex: none; border: 0; border-radius: 14px; padding: 3px; background: {{trackBg}}; display: flex; justify-content: {{knobSide}}">
<span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; display: block"></span>
</button>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px">
<span style="flex: 1 1 auto; font-size: 15px; font-weight: 500">ในรายงานของฉัน</span>
<button style="height: 36px; box-sizing: border-box; border-radius: 18px; border: 1px solid #DCE2E6; background: #FFFFFF; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 14px; font-weight: 600; color: #0E7C6B">รวมในรายงาน<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 9l6 7 6-7z"></path></svg></button>
</div>
</div>
<div style="margin-top: auto; border-radius: 12px; background: #2A3237; color: #FFFFFF; padding: 10px 14px; display: flex; align-items: center; gap: 12px">
<span style="flex: 1 1 auto; font-size: 13px">บันทึกไม่สำเร็จ ค่ากลับเป็นเดิมแล้ว</span>
<button style="border: 0; background: transparent; padding: 0; font-family: inherit; font-size: 13px; font-weight: 600; color: #7FD8C6">ลองใหม่</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":300}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: true };
  }
  renderVals() {
    const on = this.state.on;
    return {
      on: on ? 'true' : 'false',
      trackBg: on ? '#12A08A' : '#C9D1D6',
      knobSide: on ? 'flex-end' : 'flex-start',
      toggle: () => this.setState({ on: !this.state.on }),
    };
  }
}
</script>
</body>
</html>
