<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>แท็บแบบ pill</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5E51}
</style>
</helmet>
<div style="width: 390px; height: 560px; box-sizing: border-box; padding: 16px; background: #F3F5F7; font-family: 'Noto Sans Thai', system-ui, sans-serif; color: #1D2327; display: flex; flex-direction: column; gap: 20px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 8px">
<div role="tablist" onPointerDown="{{g.onDown}}" onPointerMove="{{g.onMove}}" onPointerUp="{{g.onUp}}" onPointerCancel="{{g.onUp}}" style="position: relative; height: 40px; box-sizing: border-box; padding: 3px; border-radius: 20px; border: 1px solid #D5DCE1; background: #EEF1F3; display: flex; touch-action: none; user-select: none; cursor: grab">
<div aria-hidden="true" style="position: absolute; top: 3px; bottom: 3px; left: 3px; box-sizing: border-box; border-radius: 17px; border: 1px solid #6CCDBA; background: #C4F1E8; box-shadow: 0 1px 2px rgba(10,79,68,0.12); {{g.pillDyn}}"></div>
<sc-for list="{{g.tabs}}" as="t" hint-placeholder-count="3">
<button role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="position: relative; flex: 1 1 0; min-width: 0; border: 0; background: transparent; padding: 0 4px; font-family: inherit; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 5px; cursor: inherit; transition: color 200ms; color: {{t.fg}}; font-weight: {{t.fw}}">
<sc-if value="{{t.showIcon}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{t.d}}"></path></svg></sc-if>
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.label}}</span>
</button>
</sc-for>
</div>
<div style="overflow: hidden; border-radius: 14px; background: #FFFFFF">
<div style="display: flex; {{g.contentDyn}}">
<sc-for list="{{g.tabs}}" as="t" hint-placeholder-count="3">
<div style="flex: 0 0 100%; box-sizing: border-box; height: 64px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #3C474F">{{t.label}}</span>
<div style="display: flex; gap: 6px"><span style="height: 8px; width: 46%; border-radius: 4px; background: #EEF1F3"></span><span style="height: 8px; width: 28%; border-radius: 4px; background: #EEF1F3"></span></div>
</div>
</sc-for>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":560}}'>
const ICON = {
  overview: 'M12 3v9h9M21 12a9 9 0 1 1-9-9',
  calendar: 'M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM4 10h16M9 3v4M15 3v4',
  list: 'M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM8 8h8M8 12h8M8 16h5',
  debt: 'M3 12l4-4h4l3 3-2 2-2-2M21 12l-4 4h-5l-4-4',
  save: 'M4 4h16v5H4zM5 9v10h14V9M10 13h4',
  members: 'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20a6 6 0 0 1 12 0M16 5a3 3 0 0 1 0 6M21 20a6 6 0 0 0-4-5.6',
  bill: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
};
const GROUPS = [
  { key: 'two', tabs: [['ภาพรวม', 'overview'], ['ปฏิทิน', 'calendar']] },
  { key: 'three', tabs: [['รายการ', 'list'], ['หนี้', 'debt'], ['ออม', 'save']] },
  { key: 'four', tabs: [['ภาพรวม', 'overview'], ['รายการ', 'list'], ['สมาชิก', 'members'], ['บิล', 'bill']] },
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { two: { i: 0, dx: 0, drag: false }, three: { i: 0, dx: 0, drag: false }, four: { i: 0, dx: 0, drag: false } };
    this.press = {};
  }
  patch(key, p) {
    this.setState({ [key]: Object.assign({}, this.state[key], p) });
  }
  group(def) {
    const key = def.key;
    const n = def.tabs.length;
    const s = this.state[key];
    const ease = 'cubic-bezier(.2,.8,.2,1)';
    const onDown = (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      this.press[key] = { x: e.clientX, left: r.left + 3, segW: (r.width - 6) / n, moved: false };
      if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
    };
    const onMove = (e) => {
      const p = this.press[key];
      if (!p) return;
      let dx = e.clientX - p.x;
      if (!p.moved && Math.abs(dx) < 6) return;
      p.moved = true;
      const min = -s.i * p.segW;
      const max = (n - 1 - s.i) * p.segW;
      dx = Math.max(min, Math.min(max, dx));
      this.patch(key, { dx, drag: true });
    };
    const onUp = (e) => {
      const p = this.press[key];
      this.press[key] = null;
      if (!p) return;
      if (p.moved) {
        const target = Math.max(0, Math.min(n - 1, Math.round(s.i + this.state[key].dx / p.segW)));
        this.patch(key, { i: target, dx: 0, drag: false });
      } else if (e.type === 'pointerup') {
        const idx = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - p.left) / p.segW)));
        this.patch(key, { i: idx, dx: 0, drag: false });
      }
    };
    const pos = n === 4 ? 4 : n;
    return {
      onDown, onMove, onUp,
      pillDyn: 'width: calc((100% - 6px) / ' + n + '); transform: translateX(calc(' + (s.i * 100) + '% + ' + s.dx + 'px)); transition: ' + (s.drag ? 'none' : 'transform 300ms ' + ease) + ';',
      contentDyn: 'transform: translateX(-' + (s.i * 100) + '%); transition: transform 300ms ' + ease + ';',
      tabs: def.tabs.map(([label, icon], idx) => {
        const sel = idx === s.i;
        return {
          label,
          d: ICON[icon],
          sel: sel ? 'true' : 'false',
          showIcon: pos < 4 || sel,
          fg: sel ? '#0A4F44' : '#5B6770',
          fw: sel ? '700' : '500',
          pick: () => this.patch(key, { i: idx, dx: 0, drag: false }),
        };
      }),
    };
  }
  renderVals() {
    return { groups: GROUPS.map((g) => this.group(g)) };
  }
}
</script>
</body>
</html>
