<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>หนี้ หน้าคน</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5E51}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 840px; box-sizing: border-box; background: #F3F5F7; font-family: 'Noto Sans Thai', system-ui, sans-serif; color: #1D2327; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px">
<a href="DebtsList.dc.html" style="height: 36px; box-sizing: border-box; border: 1px solid #E3E8EB; border-radius: 18px; background: #FFFFFF; padding: 0 14px 0 10px; display: flex; align-items: center; gap: 8px; font-size: 15px; color: #1D2327; text-decoration: none">← <span style="color: #5B6770">หนี้สิน</span><span style="color: #8A949B">›</span>{{name}}</a>
<span style="flex: 1 1 auto"></span>
<span style="width: 34px; height: 34px; border-radius: 10px; background: #12A08A"></span>
</div>

<div style="padding: 0 12px; display: flex; flex-direction: column; gap: 12px; overflow: auto">
<div style="box-sizing: border-box; padding: 14px; border-radius: 18px; border: 1px solid {{line}}; background: linear-gradient(180deg, {{soft}} 0%, #FFFFFF 75%); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: {{avBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{initial}}</span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 17px; font-weight: 600">{{name}}</span>
<span style="font-size: 12px; color: #5B6770">{{since}}</span>
</span>
<button aria-label="ค้นหา" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 1px solid {{line}}; background: #FFFFFF; padding: 0; display: flex; align-items: center; justify-content: center; color: {{accent}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg></button>
</div>
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="flex: 1 1 auto; font-size: 15px; color: #3C474F">{{sentence}}</span>
<span style="font-size: 32px; font-weight: 700; color: {{accent}}; line-height: 1.2">{{amount}}</span>
</div>
<div style="display: flex; gap: 8px">
<button style="flex: 1.6 1 0; height: 44px; border: 0; border-radius: 22px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>{{settleLabel}}</button>
<button onClick="{{openShare}}" style="flex: 1 1 0; height: 44px; box-sizing: border-box; border: 1px solid {{line}}; border-radius: 22px; background: #FFFFFF; color: {{accent}}; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>{{shareLabel}}</button>
</div>
</div>

<sc-for list="{{days}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; padding: 0 4px"><span style="flex: 1 1 auto; font-size: 13px; font-weight: 600; color: #3C474F">{{g.label}}</span><span style="font-size: 12px; color: {{g.netColor}}">{{g.net}}</span></div>
<div style="border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="1">
<a href="{{it.href}}" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; text-decoration: none; color: inherit; background: {{it.rowBg}}">
<span style="width: 38px; height: 38px; flex: none; border-radius: 19px; background: {{it.iconBg}}; color: {{it.iconFg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg></span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5B6770">{{it.sub}}<sc-if value="{{it.paid}}" hint-placeholder-val="{{ false }}"><span style="height: 20px; border-radius: 10px; border: 1px solid #DCE2E6; padding: 0 6px; font-size: 11px; display: flex; align-items: center">✓ จ่ายแล้ว</span></sc-if></span>
</span>
<span style="font-size: 15px; font-weight: 700; color: {{it.c}}">{{it.amt}}</span>
</a>
</sc-for>
</div>
</div>
</sc-for>

<sc-if value="{{hasEarlier}}" hint-placeholder-val="{{ false }}">
<button onClick="{{toggleEarlier}}" style="border: 0; background: transparent; font-family: inherit; display: flex; align-items: center; gap: 10px; color: #5B6770; font-size: 13px; padding: 4px"><span style="flex: 1 1 auto; height: 1px; background: #DCE2E6"></span>{{earlierLabel}}<span style="flex: 1 1 auto; height: 1px; background: #DCE2E6"></span></button>
</sc-if>
<sc-if value="{{showEarlier}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px; opacity: 0.7">
<sc-for list="{{earlier}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; padding: 0 4px"><span style="flex: 1 1 auto; font-size: 13px; font-weight: 600; color: #3C474F">{{g.label}}</span><span style="font-size: 12px; color: {{g.netColor}}">{{g.net}}</span></div>
<div style="border-radius: 16px; background: #FFFFFF; overflow: hidden">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="1">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: {{it.rowBg}}">
<span style="width: 38px; height: 38px; flex: none; border-radius: 19px; background: {{it.iconBg}}; color: {{it.iconFg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg></span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 15px">{{it.title}}</span><span style="font-size: 12px; color: #5B6770">{{it.sub}}</span></span>
<span style="font-size: 15px; font-weight: 700; color: {{it.c}}">{{it.amt}}</span>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</sc-if>
<div style="height: 12px"></div>
</div>

<sc-if value="{{share}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(20,28,32,0.42); display: flex; flex-direction: column; justify-content: flex-end">
<div style="border-radius: 20px 20px 0 0; background: #FFFFFF; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 12px">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #D5DCE1"></span>
<div style="display: flex; align-items: center"><span style="flex: 1 1 auto; font-size: 17px; font-weight: 600">{{shareTitle}}</span><button aria-label="ปิด" onClick="{{closeShare}}" style="width: 32px; height: 32px; border: 0; border-radius: 16px; background: #EEF1F3">×</button></div>
<div style="display: flex; gap: 6px"><span style="height: 28px; box-sizing: border-box; border-radius: 14px; border: 1px solid #12A08A; background: #DDF2EE; padding: 0 10px; display: flex; align-items: center; font-size: 12px; font-weight: 600">รอบนี้</span><span style="height: 28px; box-sizing: border-box; border-radius: 14px; border: 1px solid #DCE2E6; padding: 0 10px; display: flex; align-items: center; font-size: 12px">ยอดคงเหลืออย่างเดียว</span></div>
<label for="msg" style="font-size: 12px; color: #5B6770">ข้อความ (แก้ได้ก่อนส่ง)</label>
<textarea id="msg" rows="6" style="font-family: inherit; font-size: 14px; line-height: 1.6; border: 1px solid #D5DCE1; border-radius: 12px; padding: 10px 12px; resize: none">{{shareText}}</textarea>
<div style="display: flex; gap: 8px"><button style="flex: 1 1 0; height: 44px; box-sizing: border-box; border: 1px solid #D5DCE1; border-radius: 22px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600">คัดลอก</button><button style="flex: 1 1 0; height: 44px; border: 0; border-radius: 22px; background: #12A08A; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600">แชร์ไป LINE / แอปอื่น</button></div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"person":{"editor":"enum","options":["ลี ทดสอบ","บอส ทดสอบ"],"default":"ลี ทดสอบ"},"$preview":{"width":390,"height":840}}'>
const IC = {
  food: 'M4 11h16a8 8 0 0 1-16 0zM8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4',
  cash: 'M3 7h18v10H3zM12 9.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z',
  loan: 'M12 19V5M7 10l5-5 5 5',
  ticket: 'M4 8h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z',
};
const RED = '#D93A3F', GREEN = '#1E9E4F';
function debt(title, sub, amt, side, icon, paid) {
  return { title, sub, amt, c: side === 'out' ? RED : GREEN, paid: !!paid, icon: icon || IC.food, iconBg: '#FFE9D6', iconFg: '#E07A2E', rowBg: '#FFFFFF', href: 'DebtEntry.dc.html' };
}
function repay(title, sub, amt) {
  return { title, sub, amt, c: '#3C474F', paid: false, icon: IC.cash, iconBg: '#DDF2EE', iconFg: '#12A08A', rowBg: '#F6FBFA', href: '#' };
}
const DATA = {
  'ลี ทดสอบ': {
    initial: 'ลี', avBg: '#4F8BD6', side: 'out', amount: '฿230', since: 'ค้าง 23 วัน | ติดต่อกันตั้งแต่ ก.ย. 2026',
    days: [
      { label: 'ศ. 10 ต.ค. 2026', net: 'ลดลง ฿400', netColor: '#12A08A', items: [repay('คุณจ่ายคืนลี', 'จากกระเป๋า test2', '฿400')] },
      { label: 'อา. 5 ต.ค. 2026', net: 'เพิ่ม ฿70', netColor: RED, items: [debt('ค่าอาหารอีกรอบ', 'ลีจ่ายแทน', '฿70', 'out')] },
      { label: 'อ. 28 ก.ย. 2026', net: 'เพิ่ม ฿500', netColor: RED, items: [debt('ยืมเงินลี', 'เข้ากระเป๋า test2', '฿500', 'out', IC.loan)] },
      { label: 'ศ. 25 ก.ย. 2026', net: 'เพิ่ม ฿60', netColor: RED, items: [debt('ค่าอาหาร', 'ลีจ่าย ฿120 | แบ่งครึ่ง', '฿60', 'out', IC.food, true)] },
    ],
    earlier: [],
    share: 'สรุปยอดกับลี (ตั้งแต่ 25 ก.ย.)\n• 25 ก.ย. ค่าอาหาร 60\n• 28 ก.ย. ยืมเงิน 500\n• 5 ต.ค. ค่าอาหาร 70\n• 10 ต.ค. คืนแล้ว −400\nคงเหลือ ฉันติดลี 230 บาท',
  },
  'บอส ทดสอบ': {
    initial: 'บอ', avBg: '#E2547C', side: 'in', amount: '฿45', since: 'ค้าง 3 วัน | ติดต่อกันตั้งแต่ ส.ค. 2026',
    days: [
      { label: 'ส. 18 ต.ค. 2026', net: 'เพิ่ม ฿45', netColor: GREEN, items: [debt('ค่ากาแฟ', 'คุณจ่ายแทน', '฿45', 'in')] },
    ],
    earlier: [
      { label: 'พ. 20 ส.ค. 2026', net: 'ลดลง ฿150', netColor: '#12A08A', items: [repay('บอสคืนเงิน', 'ไม่ระบุกระเป๋า', '฿150')] },
      { label: 'ศ. 1 ส.ค. 2026', net: 'เพิ่ม ฿150', netColor: GREEN, items: [debt('ให้ยืม', 'คุณให้ยืม', '฿150', 'in', IC.loan)] },
    ],
    share: 'สรุปยอดกับบอส\n• 18 ต.ค. ค่ากาแฟ 45\nคงเหลือ บอสติดฉัน 45 บาท',
  },
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { share: false, earlier: false };
  }
  renderVals() {
    const name = this.props.person ?? 'ลี ทดสอบ';
    const d = DATA[name] || DATA['ลี ทดสอบ'];
    const out = d.side === 'out';
    const short = name.split(' ')[0];
    return {
      name, initial: d.initial, avBg: d.avBg, since: d.since, amount: d.amount,
      accent: out ? RED : GREEN,
      line: out ? '#F2C2C3' : '#A9DDBA',
      soft: out ? '#FCE6E6' : '#DDF3E4',
      sentence: out ? 'รอจ่ายให้' + short : 'รอรับจาก' + short,
      settleLabel: out ? 'จ่ายคืน ' + d.amount : 'รับคืน ' + d.amount,
      shareLabel: out ? 'สรุปยอด' : 'ทวง',
      shareTitle: out ? 'สรุปยอดกับ' + short : 'ทวงยอดกับ' + short,
      shareText: d.share,
      days: d.days,
      hasEarlier: d.earlier.length > 0,
      earlier: d.earlier,
      showEarlier: this.state.earlier && d.earlier.length > 0,
      earlierLabel: this.state.earlier ? 'ซ่อนรอบก่อน ▴' : 'เคลียร์ครบ 20 ส.ค. | ดูรอบก่อน ▾',
      toggleEarlier: () => this.setState({ earlier: !this.state.earlier }),
      share: this.state.share,
      openShare: () => this.setState({ share: true }),
      closeShare: () => this.setState({ share: false }),
    };
  }
}
</script>
</body>
</html>
