<!doctype html>
<html lang="th">
<head>

</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5E51}
</style>
</helmet>
<div style="width: 390px; height: 820px; box-sizing: border-box; background: #F3F5F7; font-family: 'Noto Sans Thai', system-ui, sans-serif; color: #1D2327; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px">
<a href="DebtPerson.dc.html" style="height: 36px; box-sizing: border-box; border: 1px solid #E3E8EB; border-radius: 18px; background: #FFFFFF; padding: 0 14px 0 10px; display: flex; align-items: center; gap: 8px; font-size: 15px; color: #1D2327; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>รายการหนี้</a>
<span style="flex: 1 1 auto"></span>
<span style="width: 34px; height: 34px; border-radius: 10px; background: #12A08A"></span>
</div>

<div style="padding: 0 12px; display: flex; flex-direction: column; gap: 12px">
<div style="box-sizing: border-box; padding: 14px; border-radius: 18px; border: 1px solid #A9DDBA; background: linear-gradient(180deg, #DDF3E4 0%, #FFFFFF 75%); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="height: 32px; box-sizing: border-box; border-radius: 16px; border: 1px solid #1E9E4F; background: #FFFFFF; padding: 0 12px; display: flex; align-items: center; font-size: 13px; font-weight: 600; color: #1E9E4F">↙ รอรับ</span>
<span style="flex: 1 1 auto"></span>
<span style="height: 32px; box-sizing: border-box; border-radius: 16px; border: 1px solid #DCE2E6; background: #FFFFFF; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #3C474F"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>17 ก.ย.</span>
<a href="DebtEntryEdit.dc.html" aria-label="แก้ไข" style="width: 40px; height: 40px; flex: none; box-sizing: border-box; border-radius: 20px; border: 1px solid #A9DDBA; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1E9E4F">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg>
</a>
</div>
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="flex: 1 1 auto; min-width: 0; font-size: 17px; font-weight: 600">Food Delivery</span>
<span style="font-size: 32px; font-weight: 700; color: #1E9E4F">฿82</span>
</div>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 6px; font-size: 12px; color: #3C474F">รอรับจาก chalee <b style="color: #1E9E4F">฿82</b><sc-if value="{{paid}}" hint-placeholder-val="{{ false }}"><span style="height: 20px; border-radius: 10px; border: 1px solid #DCE2E6; background: #EEF1F3; padding: 0 6px; font-size: 11px; display: flex; align-items: center">✓ จ่ายแล้ว</span></sc-if></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="DebtPerson.dc.html" style="height: 64px; box-sizing: border-box; border-radius: 12px; border: 1px solid #CDE9D6; background: #FFFFFF; padding: 10px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit"><span style="width: 32px; height: 32px; flex: none; border-radius: 16px; background: #E9EDF0; color: #5B6770; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">C</span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 11px; color: #5B6770">กับใคร</span><span style="font-size: 15px; font-weight: 600">chalee ›</span></span></a>
<a href="#" style="height: 64px; box-sizing: border-box; border-radius: 12px; border: 1px solid #CFE0F4; background: #FFFFFF; padding: 10px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit"><span style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #E3EEFB; color: #3B7DD8; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM8 8h8M8 12h8M8 16h5"></path></svg></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 11px; color: #5B6770">มาจาก (แบ่งบิล)</span><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Food Delivery ฿164 ›</span></span></a>
</div>
</div>

<div style="border-radius: 16px; background: #FFFFFF; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px">
<label for="paid" style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 500">จ่ายแล้ว</span>
<span style="font-size: 12px; color: #5B6770">เป็นป้ายบอกเท่านั้น ไม่มีผลกับยอด</span>
</label>
<button id="paid" role="switch" aria-checked="{{paidAria}}" onClick="{{togglePaid}}" style="width: 48px; height: 28px; flex: none; border: 0; border-radius: 14px; padding: 3px; background: {{paidBg}}; display: flex; justify-content: {{paidSide}}">
<span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; display: block"></span>
</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 15px; font-weight: 600; color: #0E7C6B; padding: 0 4px">โน้ต</span>
<div style="border-radius: 16px; background: #FFFFFF; padding: 12px 14px; font-size: 14px; line-height: 1.6">แบ่งค่าข้าวเที่ยงคนละครึ่ง</div>
</div>

<span style="font-size: 12px; color: #8A949B; padding: 0 4px">สร้าง 17/9/2026 12:40 | แก้ไขล่าสุด 18/9/2026 09:12</span>
<button style="align-self: flex-start; border: 0; background: transparent; padding: 4px; font-family: inherit; font-size: 15px; font-weight: 600; color: #D93A3F">ลบรายการหนี้</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paid: false };
  }
  renderVals() {
    const p = this.state.paid;
    return {
      paid: p,
      paidAria: p ? 'true' : 'false',
      paidBg: p ? '#12A08A' : '#C9D1D6',
      paidSide: p ? 'flex-end' : 'flex-start',
      togglePaid: () => this.setState({ paid: !this.state.paid }),
    };
  }
}
</script>
</body>
</html>
